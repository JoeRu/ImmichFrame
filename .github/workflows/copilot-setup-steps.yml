name: Copilot Setup Steps

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore .NET dependencies
        run: dotnet restore ImmichFrame.sln

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: immichFrame.Web/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: immichFrame.Web

      - name: Install Playwright MCP server
        run: npm install --global @playwright/mcp@latest

      - name: Install Chromium for Playwright
        run: npx --yes playwright@latest install --with-deps chromium
